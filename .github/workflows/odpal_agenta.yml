name: Agent Nieruchomosci AI

on:
  issues:
    types: [opened]

jobs:
  uruchom-system:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj biblioteki
        run: python -m pip install --upgrade requests google-genai huggingface_hub pillow

      - name: Uruchom Agenta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HF_MODEL: ${{ vars.HF_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
        run: python agent.py
